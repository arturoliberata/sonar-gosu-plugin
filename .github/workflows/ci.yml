name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and unit tests
        run: sh ./mvnw -B verify

      # Step 3 of SonarQube's "supporting new languages" guide: the grammar must keep
      # parsing real Gosu code. This parses every .gs/.gsx/.gsp file in gosu-lang and
      # runs the full sensor on them.
      - name: Download gosu-lang sources
        run: |
          curl -sSL https://github.com/gosu-lang/gosu-lang/archive/refs/heads/master.zip -o gosu-lang.zip
          unzip -q gosu-lang.zip -d "$RUNNER_TEMP/gosu-corpus"

      - name: Grammar corpus test
        run: >
          sh ./mvnw -B test -Dtest=GosuCorpusTest
          -Dgosu.corpus="$RUNNER_TEMP/gosu-corpus"
          -Dgosu.corpus.minRate=0.99
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload plugin and corpus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-gosu-plugin
          path: |
            target/*.jar
            target/corpus-report.txt
            target/corpus-issues.txt
          if-no-files-found: ignore
